# Unattended login for com.ImplusOS.loginui.
#
# A single line, one of:
#   username             - log in as this existing user, no password prompt
#   username:password    - on first boot, create this account then log in
#
# Blank, absent, or starting with '#' => normal interactive login.
# A writable copy at /var/System/autologin takes precedence over this seed.
#
#tester:tester123
